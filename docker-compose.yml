services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: notebook-annotator:latest
    container_name: notebook-annotator-dev
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
